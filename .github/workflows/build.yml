name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # ubuntu-latest 镜像已预装 Android SDK，直接用预置路径，
      # 不装 android-actions/setup-android（它会卡在 sdkmanager 许可证交互）
      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK 路径: $SDK"
          if [ ! -d "$SDK" ]; then
            echo "::error::未找到 Android SDK"
            ls /usr/local/lib/android 2>/dev/null || true
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          # 确认需要的 platform 与 build-tools 在不在
          ls "$SDK/platforms" 2>/dev/null | sort -V | tail -3
          ls "$SDK/build-tools" 2>/dev/null | sort -V | tail -3
          echo "sdk.dir=$SDK" > local.properties

      - name: Pre-accept SDK licenses
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo "licenses done"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Collect APK info
        if: success()
        run: |
          echo "### APK 构建完成" >> $GITHUB_STEP_SUMMARY
          find app/build/outputs/apk -name '*.apk' | while read apk; do
            size=$(du -h "$apk" | cut -f1)
            echo "- \`$(basename "$apk")\` · $size" >> $GITHUB_STEP_SUMMARY
            ls -lh "$apk"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: linuxdo-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-reports
          path: |
            app/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
