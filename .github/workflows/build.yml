name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 仓库暂未提交 gradle-wrapper.jar（二进制），CI 里先生成 wrapper
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Collect APK info
        if: success()
        run: |
          find app/build/outputs/apk -name '*.apk' -exec ls -lh {} \;
          echo "### APK 构建完成" >> $GITHUB_STEP_SUMMARY
          find app/build/outputs/apk -name '*.apk' -exec sh -c \
            'echo "- \`$(basename {})\` · $(du -h {} | cut -f1)" >> $GITHUB_STEP_SUMMARY' \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: linuxdo-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-reports
          path: |
            app/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
